name: 币安合约带单成交监控
run-name: ${{ (github.event_name == 'schedule' || inputs.mode == 'scheduled') && '币安合约带单成交（定时）' || '币安合约带单成交（预览）' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview 只打印最新成交，scheduled 检查并推送新成交"
        type: choice
        options: [preview, scheduled]
        default: preview
  # cron-job.org 每分钟派发，每次运行相隔约 30 秒检查两轮。Actions 自带计划作兜底。
  schedule:
    - cron: "3-59/5 * * * *"

concurrency:
  group: binance-copy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relay:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') || vars.BINANCE_COPY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --include=dev --no-package-lock --no-audit --no-fund
      - name: 编译并运行测试
        run: npm test
      - name: 预览最新成交
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          BINANCE_COPY_PORTFOLIO_ID: ${{ vars.BINANCE_COPY_PORTFOLIO_ID }}
        run: npm run binance-copy:dry-run
      - name: 读取带单投递进度
        id: state
        if: github.event_name == 'schedule' || inputs.mode == 'scheduled'
        run: |
          ref=refs/heads/binance-copy-state
          remote_ref=$(git ls-remote --heads origin "$ref")
          if [[ -n "$remote_ref" ]]; then
            git fetch --depth=1 origin "$ref"
            git worktree add --detach .binance-copy FETCH_HEAD
            for db in .binance-copy/*.sqlite; do test -s "$db"; done
          else
            git worktree add --detach --no-checkout .binance-copy HEAD
            git -C .binance-copy switch --orphan binance-copy-state
          fi
      - name: 推送币安新成交
        if: steps.state.outcome == 'success'
        env:
          BINANCE_COPY_PORTFOLIO_ID: ${{ vars.BINANCE_COPY_PORTFOLIO_ID }}
          BINANCE_COPY_CHANNELS: ${{ vars.BINANCE_COPY_CHANNELS }}
          TELEGRAM_RELAY_CHANNELS: ${{ vars.TELEGRAM_RELAY_CHANNELS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECHAT_PUSH_ENABLED: ${{ vars.WECHAT_PUSH_ENABLED }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          next_poll=$((SECONDS + 30))
          status=0
          npm run binance-copy || status=$?
          remaining=$((next_poll - SECONDS))
          if (( remaining > 0 )); then sleep "$remaining"; fi
          npm run binance-copy || status=$?
          exit "$status"
      - name: 保存带单投递进度（含部分成功）
        if: always() && steps.state.outcome == 'success'
        working-directory: .binance-copy
        run: |
          if ! compgen -G '*.sqlite' > /dev/null; then exit 0; fi
          git add -- *.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '保存币安带单投递进度'
          git push origin HEAD:refs/heads/binance-copy-state
