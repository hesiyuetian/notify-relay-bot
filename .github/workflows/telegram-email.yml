name: Telegram 频道邮件转发
run-name: ${{ (github.event_name == 'schedule' || inputs.mode == 'scheduled') && 'Telegram 频道转发（定时）' || (inputs.mode == 'test-wechat' && 'Telegram 频道转发（微信测试）' || 'Telegram 频道转发（邮件测试）') }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test 测试邮件，test-wechat 测试个人微信，scheduled 检查新帖"
        type: choice
        options: [test, test-wechat, scheduled]
        default: test
  # 主触发为 cron-job.org 每分钟一次。此计划只作兜底，两种触发共用投递进度。
  schedule:
    - cron: "2-59/5 * * * *"

concurrency:
  group: telegram-email-aoying999
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --include=dev --no-audit --no-fund
      - name: 编译并运行测试
        run: npm test
      - name: 读取独立分支中的投递进度
        id: state
        if: github.event_name == 'schedule' || inputs.mode == 'scheduled'
        run: |
          ref=refs/heads/telegram-email-state
          remote_ref=$(git ls-remote --heads origin "$ref")
          if [[ -n "$remote_ref" ]]; then
            git fetch --depth=1 origin "$ref"
            git worktree add --detach .telegram-email FETCH_HEAD
            for db in .telegram-email/*.sqlite; do test -s "$db"; done
          else
            git worktree add --orphan -b telegram-email-state .telegram-email
          fi
      - name: 转发频道消息
        env:
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [[ "$MODE" == "test" ]]; then
            npm run telegram-email -- --test-email
          elif [[ "$MODE" == "test-wechat" ]]; then
            npm run telegram-email -- --test-wechat
          else
            npm run telegram-email
          fi
      - name: 保存投递进度（含部分成功）
        if: always() && steps.state.outcome == 'success'
        working-directory: .telegram-email
        run: |
          if ! compgen -G '*.sqlite' > /dev/null; then exit 0; fi
          git add -- *.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '保存频道邮件投递进度'
          git push origin HEAD:refs/heads/telegram-email-state
